name: Verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gv_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: gv_workspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit and PGlite integration tests
        run: npm test
      - name: Disposable PostgreSQL integration tests
        run: npm test
        env:
          GV_TEST_DATABASE_URL: postgres://gv_test:disposable_ci_only@127.0.0.1:5432/gv_workspace_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=high
